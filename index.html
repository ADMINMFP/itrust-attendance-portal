
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITRUST INFRATECH - Attendance Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f9;
      color: #1e293b;
    }

    header {
      background: #123e70;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h2 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h3 {
      color: #174b83;
      margin-top: 0;
    }

    .card p {
      color: #64748b;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      background: #fff4d6;
      color: #8a5a00;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h2>ITRUST INFRATECH</h2>
    <p>MUZAFFARPUR | ATTENDANCE MANAGEMENT PORTAL</p>
  </header>

  <div class="container">
    <div class="card">
      <h3>Attendance Management System</h3>

      <p>
        Welcome to the Staff Attendance and Duty Management Portal.
      </p>

      <div class="status">
        INITIAL SETUP
      </div>

      <p>
        Secure attendance management system is being configured.
      </p>
    </div>
  </div>

  <footer>
    © 2026 ITRUST INFRATECH
  </footer>

</body>
</html>
